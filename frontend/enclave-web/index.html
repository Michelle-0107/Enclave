<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta
      name="description"
      content="Enclave management portal entry point."
    />
    <title>Enclave · Management Portal</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202b45;
        background: #f6f5f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      main {
        width: min(100%, 760px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #e5e2dc;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(32 43 69 / 8%);
      }

      .brand {
        margin: 0 0 44px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.34em;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #747e91;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 560px;
        margin: 0;
        font-size: clamp(34px, 7vw, 54px);
        line-height: 1.08;
        letter-spacing: -0.045em;
      }

      .intro {
        max-width: 520px;
        margin: 18px 0 30px;
        color: #747e91;
        font-size: 16px;
        line-height: 1.7;
      }

      .primary {
        display: flex;
        min-height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #202b45;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: background 150ms ease, transform 150ms ease;
      }

      .primary:hover {
        transform: translateY(-1px);
        background: #2e3d5d;
      }

      .primary:focus-visible,
      .route:focus-visible {
        outline: 3px solid #8b9bb9;
        outline-offset: 3px;
      }

      h2 {
        margin: 36px 0 12px;
        font-size: 14px;
      }

      .routes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .route {
        display: flex;
        min-height: 48px;
        align-items: center;
        padding: 0 15px;
        border: 1px solid #e5e2dc;
        border-radius: 14px;
        color: #202b45;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 150ms ease, border-color 150ms ease;
      }

      .route:hover {
        border-color: #cbd1dc;
        background: #f8f8fa;
      }

      @media (max-width: 520px) {
        .brand {
          margin-bottom: 36px;
        }

        .routes {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">ENCLAVE</p>
      <p class="eyebrow">Management portal</p>
      <h1>Your community, connected.</h1>
      <p class="intro">
        Sign in to open the Enclave management workspace, or choose a portal
        section below.
      </p>

      <a class="primary" href="/sign-in">Go to management sign in</a>

      <h2>Management pages</h2>
      <nav class="routes" aria-label="Management pages">
        <a class="route" href="/management">Dashboard</a>
        <a class="route" href="/management/reports">Reports</a>
        <a class="route" href="/management/residents">Residents</a>
        <a class="route" href="/management/notifications">Notifications</a>
        <a class="route" href="/management/account">Account</a>
      </nav>
    </main>
  </body>
</html>
